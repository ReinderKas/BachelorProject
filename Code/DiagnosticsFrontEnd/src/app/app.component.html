<div class="content" role="main">
  
  <!-- Archer Model  -->
  <h1>Proof Generation.</h1>

  <h2>Predefined Models</h2>

  <div *ngFor="let model of models">
    <button (click)="selectModel(model)"> Model {{models.indexOf(model)}} </button>
  </div>
  

  <h2>Model</h2>
  <p>Define a model to generate a proof for:</p>
  <br>  
  <br>  
  
  <form class="example-form"> 
      <textarea mdInput [(ngModel)]="this.modelToDiagnose" name="Model" cols="100" rows="15"></textarea>
  </form>

  <div class="card-container">
    <button class="card card-small" (click)="proveModel()" tabindex="0">
      <svg class="material-icons" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path d="M13.5.67s.74 2.65.74 4.8c0 2.06-1.35 3.73-3.41 3.73-2.07 0-3.63-1.67-3.63-3.73l.03-.36C5.21 7.51 4 10.62 4 14c0 4.42 3.58 8 8 8s8-3.58 8-8C20 8.61 17.41 3.8 13.5.67zM11.71 19c-1.78 0-3.22-1.4-3.22-3.14 0-1.62 1.05-2.76 2.81-3.12 1.77-.36 3.6-1.21 4.62-2.58.39 1.29.59 2.65.59 4.04 0 2.65-2.15 4.8-4.8 4.8z"/></svg>
      <span>Generate Proof</span>
    </button>
  </div>

  <div *ngIf="proof.length >= 1" style="white-space:pre-wrap;">
    <h2>Proof</h2>
    {{ proof }}
  </div>
